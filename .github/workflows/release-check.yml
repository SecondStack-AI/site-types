name: Release check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slides:
    name: Slides sample decks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history and tags: the check renders the previous slides-v* release as its baseline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: checks
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium

      - name: Run the release check
        working-directory: checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node run.mjs ${BASE_REF:+--base "origin/$BASE_REF"}

      - name: Upload the report and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check
          path: checks/out/
          if-no-files-found: ignore
