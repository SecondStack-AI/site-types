<section data-layout="split">
  <div>
    <h2>A media panel instead of an image</h2>
    <ul>
      <li>The panel uses the surface color</li>
      <li>Its content is centered</li>
    </ul>
  </div>
  <div class="media">
    <svg viewBox="0 0 200 200" width="420" height="420" role="img" aria-label="Ring chart">
      <circle cx="100" cy="100" r="80" fill="none" stroke="var(--border)" stroke-width="24"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="var(--accent)" stroke-width="24" stroke-dasharray="352 503" transform="rotate(-90 100 100)"/>
      <text x="100" y="112" text-anchor="middle" font-size="36" font-weight="700" fill="var(--foreground)">70%</text>
    </svg>
  </div>
</section>
