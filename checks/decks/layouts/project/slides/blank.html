<section data-layout="blank">
  <div style="position:absolute; inset:0; display:grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr);">
    <div style="background: var(--accent)"></div>
    <div style="background: var(--surface)"></div>
    <div style="background: var(--border)"></div>
    <div style="background: var(--muted)"></div>
    <div style="background: var(--surface); grid-column: span 2; display:flex; align-items:center; padding: 0 96px;"><h2>A blank slide, composed by hand</h2></div>
    <div style="background: var(--accent); opacity: .6"></div>
    <div style="background: var(--foreground)"></div>
    <div style="background: var(--border)"></div>
    <div style="background: var(--muted)"></div>
    <div style="background: var(--surface)"></div>
    <div style="background: var(--accent)"></div>
  </div>
</section>
