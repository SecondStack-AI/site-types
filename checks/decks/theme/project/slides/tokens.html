<section>
  <h2>Die sieben Farbwerte</h2>
  <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 24px;">
    <div style="height:240px; border-radius:20px; background: var(--background); border: 2px solid var(--border)"></div>
    <div style="height:240px; border-radius:20px; background: var(--surface)"></div>
    <div style="height:240px; border-radius:20px; background: var(--foreground)"></div>
    <div style="height:240px; border-radius:20px; background: var(--muted)"></div>
    <div style="height:240px; border-radius:20px; background: var(--accent)"></div>
    <div style="height:240px; border-radius:20px; background: var(--on-accent); border: 2px solid var(--border)"></div>
    <div style="height:240px; border-radius:20px; background: var(--border)"></div>
  </div>
  <p class="small muted">background · surface · foreground · muted · accent · onAccent · border</p>
</section>
