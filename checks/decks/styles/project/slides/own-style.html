<section>
  <style>
    h2 { color: var(--accent); font-size: 96px; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .tiles > div { padding: 40px; border-radius: 32px; background: var(--surface); border: 4px solid var(--accent); font-weight: 650; }
    section > p { font-family: var(--font-mono); }
  </style>
  <h2>A slide with its own style element</h2>
  <div class="tiles"><div>One</div><div>Two</div><div>Three</div></div>
  <p>Rules in the slide win over the built-in styles.</p>
</section>
