<section>
  <style>
    @keyframes pulse { 50% { opacity: 0.4; } }
    @keyframes grow { from { width: 0; } }
  </style>
  <h2>Inline animation declarations</h2>
  <p style="animation: pulse 2s ease-in-out infinite !important">An infinite animation with !important on the element.</p>
  <div style="height: 48px; width: 70%; border-radius: 24px; background: var(--accent); animation: grow 800ms ease-out"></div>
</section>
