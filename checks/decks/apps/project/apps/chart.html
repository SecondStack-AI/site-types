<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live chart</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr; gap: 24px; padding: 56px 72px; box-sizing: border-box; background: #10223a; color: #f1f5f9; font: 32px/1.3 system-ui, sans-serif; }
  h1 { margin: 0; font-size: 56px; }
  #bars { display: flex; align-items: flex-end; gap: 32px; }
  #bars div { flex: 1; background: #38bdf8; border-radius: 16px 16px 0 0; }
  button { font: inherit; padding: 8px 24px; border-radius: 12px; }
</style>
</head>
<body>
<h1>Same-origin app <button id="vote" type="button">Vote</button></h1>
<div id="bars"></div>
<script>
  // Deterministic content, built by script, so the stage screenshot shows that the app ran.
  const votes = [3, 7, 4, 9, 6];
  const bars = document.getElementById("bars");
  for (const value of votes) {
    const bar = document.createElement("div");
    bar.style.height = `${value * 10}%`;
    bars.append(bar);
  }
  window.appReady = true;
</script>
</body>
</html>
