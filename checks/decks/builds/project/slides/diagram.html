<section>
  <h2>A diagram built in steps</h2>
  <svg viewBox="0 0 1000 300" width="1500" height="450" role="img" aria-label="Three connected boxes">
    <rect x="20" y="100" width="220" height="100" rx="16" fill="var(--surface)" stroke="var(--border)" stroke-width="3"/>
    <text x="130" y="160" text-anchor="middle" font-size="32" fill="var(--foreground)">Data</text>
    <g data-step="1">
      <path d="M240 150 H380" stroke="var(--accent)" stroke-width="6"/>
      <rect x="380" y="100" width="220" height="100" rx="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
      <text x="490" y="160" text-anchor="middle" font-size="32" fill="var(--foreground)">Viewer</text>
    </g>
    <g data-step="2">
      <path d="M600 150 H740" stroke="var(--accent)" stroke-width="6"/>
      <rect x="740" y="100" width="220" height="100" rx="16" fill="var(--accent)"/>
      <text x="850" y="160" text-anchor="middle" font-size="32" fill="var(--on-accent)">Audience</text>
    </g>
  </svg>
</section>
