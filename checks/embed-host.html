<!doctype html>
<!-- The release check's host page for the Slides host protocol: served from another site than the deck, it
     frames the viewer as Chat does and keeps every message its viewer frame sends. ?site=<deck origin>&id=<slide>. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embed host</title>
  <style>
    body { margin: 0; font: 14px sans-serif; }
    header { display: flex; gap: 8px; padding: 8px; }
    iframe { display: block; width: 1200px; height: 600px; border: 0; }
    #wrong { width: 320px; height: 180px; }
  </style>
</head>
<body>
  <header>
    <button id="present" type="button">Present</button>
    <button id="presenter" type="button">Presenter</button>
    <button id="open-presenter" type="button">Open presenter here</button>
  </header>
  <iframe id="viewer" title="Deck" sandbox="allow-scripts allow-same-origin allow-popups allow-modals allow-downloads" allow="fullscreen"></iframe>
  <iframe id="wrong" title="Deck framed with another host origin" sandbox="allow-scripts allow-same-origin allow-popups allow-modals allow-downloads"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const site = params.get("site");
    const id = params.get("id");
    const viewer = document.getElementById("viewer");
    const wrong = document.getElementById("wrong");
    // received: what a host accepts (its viewer frame, the site origin). strays: every other message.
    window.received = [];
    window.strays = [];
    addEventListener("message", (event) => {
      const accepted = event.source === viewer.contentWindow && event.origin === site;
      (accepted ? received : strays).push({ origin: event.origin, fromWrong: event.source === wrong.contentWindow, data: event.data });
    });
    window.send = (message, options = {}) => viewer.contentWindow.postMessage({ slides: 1, ...message }, { targetOrigin: site, ...options });
    window.sendWrong = (message) => wrong.contentWindow.postMessage({ slides: 1, ...message }, site);
    // A frame of the host's own origin that is not the viewer's parent.
    window.attack = (message) => {
      const frame = document.createElement("iframe");
      frame.srcdoc = `<script>parent.document.getElementById("viewer").contentWindow.postMessage(${JSON.stringify({ slides: 1, ...message })}, "*");<\/script>`;
      document.body.append(frame);
    };
    document.getElementById("present").addEventListener("click", () => send({ type: "present" }, { delegate: "fullscreen" }));
    document.getElementById("presenter").addEventListener("click", () => send({ type: "presenter" }));
    document.getElementById("open-presenter").addEventListener("click", () => {
      window.hostPresenter = window.open(`${site}/?presenter=1#${id}`, "host-presenter", "popup,width=1000,height=600");
    });
    viewer.src = `${site}/?embed=1&host=${encodeURIComponent(location.origin)}#${id}`;
    wrong.src = `${site}/?embed=1&host=${encodeURIComponent("https://wrong.invalid")}#${id}`;
  </script>
</body>
</html>
